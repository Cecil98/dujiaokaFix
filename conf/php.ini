; Baseline hardening for the dujiaoka image.
date.timezone=Asia/Shanghai
memory_limit=256M
upload_max_filesize=50M
post_max_size=50M
max_file_uploads=20
max_execution_time=300
max_input_time=60
max_input_vars=2000

; Do not expose PHP internals or errors to clients.
expose_php=Off
display_errors=Off
display_startup_errors=Off
log_errors=On
zend.exception_ignore_args=On

; Path/stream safety.
cgi.fix_pathinfo=0
allow_url_include=Off
phar.readonly=On
phar.require_hash=On

; Session cookie hardening. Secure is controlled by APP/HTTPS (see .env).
session.use_strict_mode=1
session.use_only_cookies=1
session.use_trans_sid=0
session.cookie_httponly=1
session.cookie_samesite=Lax
session.sid_length=48
session.sid_bits_per_character=6
session.gc_maxlifetime=7200

; The application does not need shell execution at runtime. Do not add
; curl_exec here: Guzzle, Stripe and mail drivers require it.
disable_functions=exec,passthru,shell_exec,system,proc_open,popen
