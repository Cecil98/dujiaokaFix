# Included from the webdevops vhost (inside the server block).
server_tokens off;

# These headers are sent on every response. HSTS is only honored by browsers
# over HTTPS; if TLS terminates at a host proxy, that proxy must preserve it.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;


# Do not advertise the PHP version.
fastcgi_hide_header X-Powered-By;

# Uploaded files must never be executed as PHP or used as active content.
location ^~ /uploads/ {
    limit_except GET HEAD {
        deny all;
    }
    # Do not inherit the parent headers implicitly; repeat the security ones
    # here because add_header is not inherited when this location sets any.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    location ~ /\. {
        deny all;
    }
    location ~* \.(php|phtml|phar|php[0-9])$ {
        deny all;
    }
    try_files $uri =404;
}

# The public storage symlink is for static files only.
location ^~ /storage/ {
    limit_except GET HEAD {
        deny all;
    }
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    location ~ /\. {
        deny all;
    }
    location ~* \.(php|phtml|phar|php[0-9])$ {
        deny all;
    }
    try_files $uri =404;
}

# Never serve dotfiles (.env, .git, etc.), except ACME challenges.
location ~ /\.(?!well-known).* {
    deny all;
}
