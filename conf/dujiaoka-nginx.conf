# Included from the webdevops vhost (inside the server block).
server_tokens off;

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Uploaded files must never be executed as PHP.
location ^~ /uploads/ {
    location ~ /\. {
        deny all;
    }
    location ~ \.php$ {
        deny all;
    }
    try_files $uri =404;
}

# The public storage symlink is for static files only.
location ^~ /storage/ {
    location ~ /\. {
        deny all;
    }
    location ~ \.php$ {
        deny all;
    }
    try_files $uri =404;
}

# Never serve dotfiles (.env, .git, etc.), except ACME challenges.
location ~ /\.(?!well-known).* {
    deny all;
}
